# WebSRC dev, every 10th question (5283 of 52826; the dev order runs domain by domain, so the
# subset covers them all). Same prompt, generation and metric as websrc_val.yaml; only the documents are thinned.
dataset_path: rootsautomation/websrc
task: "websrc_val_sub10"
test_split: dev
output_type: generate_until
process_docs: !function utils_sub10.every_10th
doc_to_visual: !function utils.websrc_doc_to_visual
doc_to_text: !function utils.websrc_doc_to_text
doc_to_target: "answer"
process_results: !function utils.websrc_process_results
generation_kwargs:
  max_new_tokens: 16
  image_aspect_ratio: pad
metric_list:
  - metric: websrc_squad_f1
    aggregation: !function utils.websrc_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0
