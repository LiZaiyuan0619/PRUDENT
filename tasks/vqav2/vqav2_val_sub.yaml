# VQAv2 val, the first 4 of its 68 parquet shards (about 12.6k of 214k questions). Prompt, generation and VQA
# accuracy as vqav2_val.yaml.
task: "vqav2_val_sub"
include: _default_template_vqav2_yaml
dataset_path: lmms-lab/VQAv2
dataset_kwargs:
  data_files:
    validation:
      - "data/validation-00000-of-00068.parquet"
      - "data/validation-00001-of-00068.parquet"
      - "data/validation-00002-of-00068.parquet"
      - "data/validation-00003-of-00068.parquet"
test_split: validation
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
process_results: !function utils.vqav2_process_results_val
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
